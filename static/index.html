<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDIE</title>
    
    <!-- CSS 파일들 -->
    <link rel="stylesheet" href="/static/styles/main.css">
    <link rel="stylesheet" href="/static/styles/chatbot.css">
    <link rel="stylesheet" href="/static/styles/navbar.css">
</head>
<body>
    <!-- 햄버거 메뉴 버튼 -->
    <button id="hamburger-btn" class="hamburger-menu">
        ☰
    </button>

    <!-- 사이드바 오버레이 -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 사이드바 -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>EDIE</h2>
            <button id="close-sidebar" class="close-sidebar">
                ×
            </button>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="/" class="menu-link">
                    <span class="menu-icon">🏠</span>
                    <span>채팅&카메라</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/touch-laser" class="menu-link">
                    <span class="menu-icon">🎮</span>
                    <span>터치&레이저</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/behavior-tree" class="menu-link">
                    <span class="menu-icon">🌳</span>
                    <span>행동트리</span>
                </a>
            </li>
        </ul>
    </nav>

    <div class="container">
        <!-- 카메라/감정/프레임 영역 -->
        <div class="camera-section">
            <div class="camera-frame">
                <div class="camera-title">에디의 시야</div>
                <div class="camera-tabs" style="display:flex; border-bottom:2px solid #e0e0e0;">
                    <button class="tab-btn active" data-tab="camera" style="flex:1; padding:12px 0; background:#f8f8f8; border:none; border-bottom:2px solid transparent; font-size:1.1em; font-weight:600; cursor:pointer;">Camera View</button>
                    <button class="tab-btn" data-tab="edie" style="flex:1; padding:12px 0; background:#f8f8f8; border:none; border-bottom:2px solid transparent; font-size:1.1em; font-weight:600; cursor:pointer;">EDIE Emotion</button>
                </div>
                <style>
                    .camera-inner-frame .tab-content {
                        aspect-ratio: 16 / 9;
                        width: 100%;
                        background: #fff;
                        box-sizing: border-box;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    }
                    .camera-viewer {
                        width: 100%;
                        height: 100%;
                        background: #000;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        border-radius: 10px;
                        overflow: hidden;
                    }
                    .camera-viewer img {
                        width: 100%;
                        height: 100%;
                        object-fit: contain;
                        display: block;
                    }
                </style>
                <div class="camera-inner-frame" style="padding-top:0;">
                    <div class="tab-content" id="tab-camera">
                        <div class="camera-viewer">
                            <img src="/camera/stream" alt="Camera Stream" id="camera-stream">
                        </div>
                    </div>
                    <div class="tab-content" id="tab-edie" style="display:none;">
                        <!-- EDIE 감정: 흰색 빈 배경 (16:9 비율) -->
                        <div id="edie-emotion-image-box" style="display:flex; justify-content:center; align-items:center; height:100%;">
                            <img id="edie-emotion-image" src="/static/face/expressionless.png" style="width:200px; height:200px; object-fit:contain;">
                        </div>
                    </div>
                </div>
            </div>
                <div class="emotion-container">
                    <div class="emotion-left">
                        <div class="user-emotion-box">
                            사용자 감정
                        </div>
                        <div class="user-emotion-container">
                            <div id="user-emotion-bars" class="user-emotion-bars">
                                <!-- 감정별 가로 막대 그래프 -->
                                <div class="user-emotion-bar-row" data-emotion="Anger">
                                    <span class="bar-label">Anger</span>
                                    <div class="bar-bg"><div class="bar-fill" style="width:0%"></div></div>
                                    <span class="bar-value">0%</span>
                                </div>
                                <div class="user-emotion-bar-row" data-emotion="Happiness">
                                    <span class="bar-label">Happiness</span>
                                    <div class="bar-bg"><div class="bar-fill" style="width:0%"></div></div>
                                    <span class="bar-value">0%</span>
                                </div>
                                <div class="user-emotion-bar-row" data-emotion="Sadness">
                                    <span class="bar-label">Sadness</span>
                                    <div class="bar-bg"><div class="bar-fill" style="width:0%"></div></div>
                                    <span class="bar-value">0%</span>
                                </div>
                                <div class="user-emotion-bar-row" data-emotion="Surprise">
                                    <span class="bar-label">Surprise</span>
                                    <div class="bar-bg"><div class="bar-fill" style="width:0%"></div></div>
                                    <span class="bar-value">0%</span>
                                </div>
                                <div class="user-emotion-bar-row" data-emotion="Neutral">
                                    <span class="bar-label">Neutral</span>
                                    <div class="bar-bg"><div class="bar-fill" style="width:0%"></div></div>
                                    <span class="bar-value">0%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="emotion-divider"></div>
                    <div class="emotion-right">
                        <div class="edie-emotion-box">에디 감정</div>
                        <div class="octagon-stack">
                            <svg width="320" height="320" viewBox="0 0 320 320">
                                <!-- 4중 정팔각형 (중심 160,160) -->
                                <polygon points="160,52 236.4,83.6 268,160 236.4,236.4 160,268 83.6,236.4 52,160 83.6,83.6" fill="none" stroke="#1a7f8a" stroke-width="4"/>
                                <polygon points="160,80 217.6,102.4 240,160 217.6,217.6 160,240 102.4,217.6 80,160 102.4,102.4" fill="none" stroke="#1a7f8a" stroke-width="2.5"/>
                                <polygon points="160,108 198.8,121.2 212,160 198.8,198.8 160,212 121.2,198.8 108,160 121.2,121.2" fill="none" stroke="#1a7f8a" stroke-width="1.5"/>
                                <polygon points="160,134 179.4,140.6 186,160 179.4,179.4 160,186 140.6,179.4 134,160 140.6,140.6" fill="none" stroke="#1a7f8a" stroke-width="1"/>
                                <!-- 꼭짓점 감정 라벨 (320 기준) -->
                                <text x="160" y="30" text-anchor="middle" font-size="14" fill="#222">궁금함</text>
                                <text x="260" y="65" text-anchor="middle" font-size="14" fill="#222">기쁨</text>
                                <text x="300" y="160" text-anchor="middle" font-size="14" fill="#222">실망</text>
                                <text x="272" y="260" text-anchor="middle" font-size="14" fill="#222">어지러움</text>
                                <text x="160" y="300" text-anchor="middle" font-size="14" fill="#222">사랑</text>
                                <text x="48" y="260" text-anchor="middle" font-size="14" fill="#222">슬픔</text>
                                <text x="14" y="160" text-anchor="middle" font-size="14" fill="#222">졸림</text>
                                <text x="55" y="65" text-anchor="middle" font-size="14" fill="#222">놀람</text>
                            </svg>
                        </div>
                    </div>
                </div>
        </div>

        <!-- 챗봇/상단 정보 영역 -->
        <div class="chat-section">
            <div class="chat-info-box">
                <div class="battery-box">
                    <div class="battery-fill" id="battery-fill"></div>
                    <div class="battery-text" id="battery-text">--%</div>
                </div>
                <div class="mic-box">
                    <div class="decibel-bar-container">
                        <div class="decibel-bar" id="decibel-bar"></div>
                    </div>
                    <div class="decibel-text" id="decibel-text">0.0 dB</div>
                    <button id="record-toggle-btn" class="record-btn">녹음</button>
                </div>
            </div>
            <div class="chat-container">
                <!-- 챗봇 헤더 -->
                <div class="chat-header">
                    <h1>EDIE</h1>
                    <button id="clear-btn" class="clear-button">대화 초기화</button>
                </div>
                <!-- 사용자 ID 입력 영역 -->
                <div class="user-id-section">
                    <div class="user-id-input">
                        <input type="text" id="user-id" placeholder="사용자 ID를 입력하세요" maxlength="20">
                        <button id="login-btn">로그인</button>
                    </div>
                    <div class="current-user" id="current-user" style="display: none;">
                        현재 사용자: <span id="current-user-name"></span>
                        <button id="logout-btn" class="logout-button">로그아웃</button>
                    </div>
                </div>
                <!-- 대화 창 -->
                <div class="chat-box" id="chat-box">
                    <div class="message bot">
                        안녕하세요! 저는 에디입니다. 먼저 사용자 ID를 입력해주세요! 🤖
                    </div>
                </div>
                <!-- 입력 영역 -->
                <div class="chat-input">
                    <!-- STT 모드 슬라이딩 토글 -->
                    <label class="toggle-switch">
                        <input type="checkbox" id="stt-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                    <input id="user-input" type="text" placeholder="메시지를 입력하세요..." autocomplete="off" />
                    <button id="mic-btn" class="mic-button" title="음성 인식"><span class="material-icons">mic</span></button>
                    <button id="send-btn">전송</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript 파일들 -->
    <script src="/static/scripts/navbar.js"></script>
    <script src="/static/scripts/chatbot.js"></script>
    <script src="/static/scripts/main.js"></script>
    <script>
        // 감정 이미지 경로를 저장할 전역 변수
        let lastEdieEmotionImage = "/static/face/expressionless.png";

        // EDIE Emotion 탭 이미지 동기화 함수
        function updateEdieEmotionImage() {
            const img = document.getElementById('edie-emotion-image');
            if (img) {
                img.src = lastEdieEmotionImage;
            }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('tab-camera').style.display = this.dataset.tab === 'camera' ? '' : 'none';
                document.getElementById('tab-edie').style.display = this.dataset.tab === 'edie' ? '' : 'none';
                if (this.dataset.tab === 'edie') {
                    updateEdieEmotionImage();
                }
            });
        });

        // 채팅 응답에서 감정 이미지 경로 파싱(예시: [감정이미지]: /static/face/xxx.png)
        function setEdieEmotionImageFromResponse(responseText) {
            const match = responseText.match(/\[감정이미지\]:\s*(\/static\/face\/[a-zA-Z0-9_\-\.]+\.png)/);
            if (match) {
                lastEdieEmotionImage = match[1];
            }
        }

        // 예시: 채팅 응답 처리 후 아래 함수 호출 필요
        // setEdieEmotionImageFromResponse(responseText);

        // 페이지 로드시 기본 이미지 동기화
        document.addEventListener('DOMContentLoaded', updateEdieEmotionImage);
    </script>
</body>
</html>
